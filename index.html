<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemas Kartika - Pemantauan Antibiotik</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2e7d32; /* Hijau Medis */
            margin-bottom: 10px;
        }
        .subtitle {
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .instruction-box {
            background-color: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 25px;
            font-size: 13px;
            color: #1b5e20;
        }
        .instruction-box ol {
            padding-left: 20px;
        }
        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #25D366; /* Warna WA */
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 30px;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }
        .btn-whatsapp:hover {
            background-color: #128C7E;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">GEMAS KARTIKA</div>
    <p class="subtitle">Gerakan Masyarakat Cerdas Gunakan Antibiotik secara Bijak dan Teratur</p>
    
    <div class="instruction-box">
        <strong>Langkah Mudah Memulai Pemantauan:</strong>
        <ol style="margin-top: 5px;">
            <li>Klik tombol hijau di bawah ini.</li>
            <li>Kirim pesan otomatis yang sudah tertera di WhatsApp Anda.</li>
            <li>Bot AI akan memandu registrasi obat Anda.</li>
        </ol>
    </div>

    <!-- Ganti nomor dan teks sesuai kebutuhan sistem Anda -->
    <a href="62817766225" class="btn-whatsapp">
        Hubungkan ke WhatsApp Bot
    </a>
</div>

</html>
